name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, build, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci # runs the build through "prepare"
      - run: npx tsc
      - run: npm test

  generated:
    name: Eval scores, docs and skill are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The stored model outputs must score as committed: a change that makes a valid
      # output invalid (or changes an error message) shows up here.
      - run: npm run eval:score
      - run: npm run docs && npm run skill
      # Text only: PNG bytes can differ between macOS and Linux. git status (not git diff)
      # also catches new untracked files, and :(glob) makes docs/**/*.md include docs/*.md.
      - name: Fail if generated files differ from what's committed
        run: |
          changed=$(git status --porcelain -- eval/results.json ':(glob)docs/**/*.md' skill)
          if [ -n "$changed" ]; then
            echo "Generated files are out of date; run npm run eval:score, npm run docs and npm run skill, then commit:"
            echo "$changed"
            git diff -- eval/results.json ':(glob)docs/**/*.md' skill | head -100
            exit 1
          fi
